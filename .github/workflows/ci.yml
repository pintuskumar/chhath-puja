name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Content integrity (translations, references, choreography)
        run: npm run check:content
      - name: Typecheck
        run: npm run typecheck
      - name: Build (static export, root path — used for Lighthouse)
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-root
          path: out
      - name: Build for GitHub Pages (sub-path)
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build && touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  lighthouse:
    name: Lighthouse (mobile)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-root
          path: out
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.json
      - name: Score summary
        if: always()
        run: node scripts/lh-summary.mjs .lighthouseci

  deploy:
    name: Deploy preview to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
