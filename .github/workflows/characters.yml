name: Generate characters (MakeHuman / MPFB)

# Builds CC0 MakeHuman characters headlessly in Blender + MPFB, exports rigged GLBs,
# renders previews, and uploads everything as an artifact.
on:
  workflow_dispatch:
    inputs:
      clips_only:
        description: "Only rebuild the animation clips"
        required: false
        default: "false"
  push:
    paths:
      - ".github/workflows/characters.yml"
      - "characters/**"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      BLENDER: ${{ github.workspace }}/blender/blender
      CHAR_OUT: ${{ github.workspace }}/chars-out
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender + MPFB + assets
        uses: actions/cache@v4
        with:
          path: |
            blender.tar.xz
            mh_assets.zip
          key: blender-4.2.9-mpfb-assets-v2

      - name: Install Blender 4.2 LTS
        run: |
          [ -f blender.tar.xz ] || curl -fsSLo blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.9-linux-x64.tar.xz
          tar xf blender.tar.xz && mv blender-*-linux-x64 blender
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libxxf86vm1 libgl1 libegl1 libsm6 >/dev/null
          $BLENDER --version | head -1

      - name: Install MPFB extension
        run: |
          git clone --depth 1 https://github.com/makehumancommunity/mpfb2.git
          (cd mpfb2/src && zip -qr ../../mpfb.zip mpfb)
          $BLENDER --background --factory-startup --command extension install-file -r user_default -e mpfb.zip
          grep -rn "def .*pack\|zipfile" mpfb2/src/mpfb/ui/*/*.py mpfb2/src/mpfb/services/assetservice.py | grep -i "zip\|pack" | head -20

      - name: Download MakeHuman system assets (CC0)
        timeout-minutes: 90
        run: |
          set -u
          command -v aria2c >/dev/null || sudo apt-get install -y -qq aria2 >/dev/null
          if [ -s mh_assets.zip ] && unzip -tq mh_assets.zip >/dev/null 2>&1; then echo "cached"; exit 0; fi
          rm -f mh_assets.zip
          CURL="curl -fL --connect-timeout 20 --max-time 600 --retry 3 --retry-delay 5 -sS"
          url=""
          for page in https://static.makehumancommunity.org/assets/assetpacks/makehuman_system_assets.html \
                      http://static.makehumancommunity.org/assets/assetpacks/makehuman_system_assets.html; do
            html=$($CURL --max-time 60 "$page" || true)
            url=$(echo "$html" | grep -oE 'https?://[^"'"'"' ]+\.zip' | head -1)
            [ -n "$url" ] && break
          done
          echo "pack url from page: ${url:-<none>}"
          # Fallbacks: known direct locations of the system assets pack
          for u in "$url" \
                   https://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip \
                   https://download.tuxfamily.org/makehuman/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip; do
            [ -z "$u" ] && continue
            echo "trying $u"
            # The server throttles per connection (~14 KB/s): split into 16 parallel ranges.
            if aria2c -q -x16 -s16 -k1M --max-tries=5 --retry-wait=5 --timeout=60 --summary-interval=60 -o mh_assets.zip "$u" \
               && unzip -tq mh_assets.zip >/dev/null 2>&1; then echo "OK $u"; break; fi
            rm -f mh_assets.zip
          done
          if [ ! -s mh_assets.zip ]; then
            echo "::warning::MakeHuman asset pack unavailable — continuing with MPFB's bundled base assets only (no skins/hair/clothes)."
          else
            ls -la mh_assets.zip && unzip -l mh_assets.zip | tail -1
          fi

      - name: Install asset pack into MPFB user data
        run: |
          DATA=$($BLENDER --background --python-expr "import sys,importlib; m=[importlib.import_module(k) for k in list(sys.modules) if k.endswith('mpfb.services.locationservice')][0]; print('USERDATA='+m.LocationService.get_user_data())" 2>/dev/null | grep USERDATA= | cut -d= -f2)
          echo "user data: $DATA"
          mkdir -p "$DATA"
          [ -s mh_assets.zip ] && unzip -qo mh_assets.zip -d "$DATA" || echo "no asset pack to install"
          ls "$DATA" | head -30

      - name: Build characters
        if: ${{ github.event.inputs.clips_only != 'true' }}
        timeout-minutes: 100
        run: |
          mkdir -p "$CHAR_OUT"
          for id in $(python3 -c "import json;print(' '.join(json.load(open('characters/specs.json'))))"); do
            echo "::group::$id"
            $BLENDER --background --python characters/blender/build_character.py -- "$id" "$CHAR_OUT" 2>&1 \
              | grep -E "\[chhath\]|Error|Traceback|File \"|line [0-9]+" | head -80
            echo "::endgroup::"
          done
          ls -la "$CHAR_OUT"

      - name: Build animation clips
        timeout-minutes: 30
        run: |
          $BLENDER --background --python characters/blender/build_clips.py -- "$CHAR_OUT" 2>&1 \
            | grep -E "\[chhath\]|Error|Traceback|File \"|line [0-9]+" | head -80
          ls -la "$CHAR_OUT"/chhath_clips.glb "$CHAR_OUT"/clips_sheet.png

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compress for the web (Meshopt + WebP) and validate
        run: |
          mkdir -p web/characters
          for f in "$CHAR_OUT"/*.glb; do
            id=$(basename "$f" .glb)
            [ "$id" = chhath_clips ] && continue
            npx --yes @gltf-transform/cli@4 optimize "$f" "web/characters/$id.glb" \
              --compress meshopt --texture-compress webp --texture-size 1024 \
              --join false --instance false --simplify false 2>&1 | tail -3
            ls -la "web/characters/$id.glb"
          done
          mkdir -p web/anims
          if [ -f "$CHAR_OUT/chhath_clips.glb" ]; then
            npx --yes @gltf-transform/cli@4 optimize "$CHAR_OUT/chhath_clips.glb" web/anims/chhath_clips.glb \
              --compress meshopt --join false --instance false --simplify false --prune false 2>&1 | tail -3
            ls -la web/anims/chhath_clips.glb
            cp web/anims/chhath_clips.glb "$CHAR_OUT/chhath_clips.web.glb"
          fi
          python3 - <<'PY'
          import json, os
          specs = json.load(open("characters/specs.json"))
          chars = {s["role"]: {"src": f"characters/{i}.glb", "height": s["height"], "license": "MakeHuman/MPFB CC0; garments generated by characters/blender (CC0)"} for i, s in specs.items() if os.path.exists(f"web/characters/{i}.glb")}
          clips = "anims/chhath_clips.glb" if os.path.exists("web/anims/chhath_clips.glb") else None
          json.dump({"version": 1, "clips": clips, "walkSpeed": 1.1, "characters": chars}, open("web/manifest.json", "w"), indent=2)
          PY
          MODELS_ROOT=web node scripts/check-models.mjs || true
          cp web/characters/*.glb "$CHAR_OUT"/ 2>/dev/null; for f in $(ls web/characters/*.glb 2>/dev/null); do mv "$CHAR_OUT/$(basename $f)" "$CHAR_OUT/$(basename $f .glb).web.glb"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: characters
          path: chars-out
